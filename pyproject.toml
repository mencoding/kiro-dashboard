[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiro-dashboard"
version = "0.4.1"
description = "Painel local de uso e créditos para o Kiro CLI (ex-Q Developer CLI)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Leonardo Menzani", email = "leonardo.menzani@gmail.com" },
]
license = { text = "Proprietary" }
keywords = ["kiro", "kiro-cli", "amazon-q", "credits", "usage", "dashboard", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Terminals",
]
dependencies = [
    "rich>=13.7",
    "click>=8.1",
    "mcp>=1.0",
    "tomli_w>=1.0",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
kiro-dash = "kiro_dash.cli:main"
kiro-dash-mcp = "kiro_dash.mcp_server:main"
kiro-dash-sync = "kiro_dash.sync:main"

[project.urls]
Homepage = "https://github.com/mencoding/kiro-dashboard"
Issues = "https://github.com/mencoding/kiro-dashboard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
